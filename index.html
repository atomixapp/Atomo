<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Películas</title>

</head>

            <div class="carousel-item" id="item-2">

            <div class="carousel-item" id="item-4">
                <img src="https://via.placeholder.com/300x150/FF00FF/000000?text=Película+4" alt="Película 4">
            </div>
            <div class="carousel-item" id="item-5">
                <img src="https://via.placeholder.com/300x150/FFA500/000000?text=Película+5" alt="Película 5">
