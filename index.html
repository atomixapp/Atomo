<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Series</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <span>IPTV</span> Downloader Pro
        </div>
        <div class="header-actions">
            <button>🔍</button>
            <button>⭐</button>
            <button>💬</button>
        </div>
    </header>
    <main>
        <aside class="sidebar">
            <input type="text" placeholder="Search Series...">
            <nav>
                <ul>
                    <li><a href="#">All Series</a></li>
                    <li><a href="#">Favorites</a></li>
                    <li><a href="#">Popular</a></li>
                    <li><a href="#">New Releases</a></li>
                </ul>
                <div class="categories">
                    <h3>Categories</h3>
                    <ul>
                        <li>English</li>
                        <li>Italian</li>
                        <li>Japanese</li>
                        <li>Spanish</li>
                        <li>Korean</li>
                        <li>Russian</li>
                        <li>Chinese</li>
                        <li>Polish</li>
                    </ul>
                </div>
            </nav>
        </aside>
        <section class="gallery">
            <div class="card">
                <img src="https://image.tmdb.org/t/p/original/6kmi6vmp6iOn4KzI7WfnVtAeJhU.jpg" alt="Series 1">
                <div class="info">
                    <span class="title">Barney & Friends</span>
                    <span class="rating">7.8</span>
                </div>
            </div>
            <div class="card">
                <img src="https://image.tmdb.org/t/p/original/6kmi6vmp6iOn4KzI7WfnVtAeJhU.jpg" alt="Series 2">
                <div class="info">
                    <span class="title">Muppets</span>
                    <span class="rating">8.1</span>
                </div>
            </div>
            <div class="card">
                <img src="https://image.tmdb.org/t/p/original/6kmi6vmp6iOn4KzI7WfnVtAeJhU.jpg" alt="Series 3">
                <div class="info">
                    <span class="title">The Silent Sea</span>
                    <span class="rating">8.0</span>
                </div>
            </div>
            <!-- More cards as needed -->
        </section>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
